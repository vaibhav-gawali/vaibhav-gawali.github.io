<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  {%- assign _og_desc = page.description | default: page.excerpt | default: site.description -%}
  <meta property="og:description" content="{{ _og_desc | strip_html | escape }}">
  <meta name="twitter:description" content="{{ _og_desc | strip_html | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  {% feed_meta %}
  {% seo %}
</head>
<body>
  <header class="site-header">
    <div class="wrapper">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/about' | relative_url }}">About</a>
        <a href="{{ '/blog' | relative_url }}">Blog</a>
        <a href="{{ '/contact' | relative_url }}">Contact</a>
        <a href="{{ site.github_username | prepend: 'https://github.com/' }}">GitHub</a>
      </nav>
    </div>
  </header>

  <main class="page-content" aria-label="Content">
    <div class="wrapper">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrapper">
      <p>&copy; {{ site.time | date: '%Y' }} {{ site.author }}</p>
      <p>{{ site.description }}</p>
    </div>
  </footer>
</body>
</html>
